[workspace]
resolver = "3"
members = ["src-axum", "src-tauri"]

# Profiles only take effect in the workspace root, not in member crates
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Release profile for the server: unwinding means a panicking handler only drops
# its own request instead of aborting the whole process
[profile.server]
inherits = "release"
panic = "unwind"
